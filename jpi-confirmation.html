<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call Confirmed — JPI Maths</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 640px;
      width: 100%;
      padding: 40px 40px 48px;
      text-align: center;
    }

    .tick {
      width: 56px;
      height: 56px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .tick svg { width: 28px; height: 28px; }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111;
    }

    .sub {
      font-size: 1rem;
      color: #555;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .video-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 12px;
    }

    .video-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      margin-bottom: 32px;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* Add to calendar */
    .cal-section {
      border-top: 1px solid #f0f0f0;
      padding-top: 28px;
      margin-bottom: 28px;
    }

    .cal-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 14px;
    }

    .cal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cal-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
      cursor: pointer;
      border: none;
    }

    .cal-btn:hover { opacity: 0.85; }

    .cal-btn.google {
      background: #4285F4;
      color: #fff;
    }

    .cal-btn.apple {
      background: #1c1c1e;
      color: #fff;
    }

    .cal-btn.outlook {
      background: #0078d4;
      color: #fff;
    }

    .cal-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .footer-note {
      font-size: 0.875rem;
      color: #888;
      line-height: 1.6;
    }

    .footer-note strong { color: #555; }
    .footer-note a { color: #555; }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 36px; }
      h1 { font-size: 1.3rem; }
      .cal-buttons { flex-direction: column; align-items: center; }
      .cal-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tick">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1>Your call is confirmed!</h1>
    <p class="sub">
      You'll receive a calendar invite shortly.
    </p>

    <p class="video-label">Watch before your call</p>
    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/JBOhxx4LF30?rel=0&modestbranding=1"
        title="Prepare for your call with Jaymin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Add to Calendar -->
    <div class="cal-section">
      <p class="cal-label">Add to calendar</p>
      <div class="cal-buttons">
        <a id="btn-google" class="cal-btn google" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google Calendar
        </a>
        <button id="btn-apple" class="cal-btn apple" onclick="downloadIcs()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98l-.09.06c-.22.15-2.16 1.26-2.14 3.75.03 2.99 2.63 3.99 2.66 4l-.07.27zM13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Apple Calendar
        </button>
        <a id="btn-outlook" class="cal-btn outlook" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 12a5 5 0 1 1 10 0A5 5 0 0 1 7 12zm5-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/><path d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6zm2 0v12h16V6H4z"/></svg>
          Outlook
        </a>
      </div>
    </div>

    <p class="footer-note">
      <strong>Need to reschedule?</strong> Use the link in your confirmation email.<br>
      Any questions — <a href="mailto:jpimaths@gmail.com">jpimaths@gmail.com</a>
    </p>
  </div>

  <script>
    // ── Parse URL params passed by GHL merge fields ───────────────────────────
    const params  = new URLSearchParams(window.location.search);
    const rawStart = params.get("start") || "";
    const rawEnd   = params.get("end")   || "";
    const title    = params.get("title") || "Oxbridge Mathematics Intro Call";

    // Convert ISO string → GCal date format: YYYYMMDDTHHmmSSZ
    function toGCalDate(iso) {
      try {
        const d = new Date(iso);
        if (isNaN(d)) return null;
        return d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      } catch { return null; }
    }

    // Generate .ics content
    function makeIcs(title, start, end) {
      const now = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      return [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//JPI Maths//Booking//EN",
        "BEGIN:VEVENT",
        `DTSTART:${start}`,
        `DTEND:${end}`,
        `DTSTAMP:${now}`,
        `SUMMARY:${title}`,
        "DESCRIPTION:Your call with Jaymin Shah — JPI Maths",
        "END:VEVENT",
        "END:VCALENDAR",
      ].join("\r\n");
    }

    function downloadIcs() {
      const start = toGCalDate(rawStart);
      const end   = toGCalDate(rawEnd);
      const content = makeIcs(title, start || "19700101T000000Z", end || "19700101T000000Z");
      const blob = new Blob([content], { type: "text/calendar;charset=utf-8" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = "jpi-call.ics"; a.click();
      URL.revokeObjectURL(url);
    }

    // ── Build calendar links ──────────────────────────────────────────────────
    const gcStart = toGCalDate(rawStart);
    const gcEnd   = toGCalDate(rawEnd);
    const details = encodeURIComponent("Your call with Jaymin Shah — JPI Maths");
    const encTitle = encodeURIComponent(title);

    if (gcStart && gcEnd) {
      document.getElementById("btn-google").href =
        `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encTitle}&dates=${gcStart}/${gcEnd}&details=${details}`;

      document.getElementById("btn-outlook").href =
        `https://outlook.live.com/calendar/0/deeplink/compose?subject=${encTitle}&startdt=${encodeURIComponent(rawStart)}&enddt=${encodeURIComponent(rawEnd)}&body=${details}`;
    } else {
      // No date info — Google opens to today, Outlook to compose
      document.getElementById("btn-google").href =
        `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encTitle}&details=${details}`;
      document.getElementById("btn-outlook").href =
        `https://outlook.live.com/calendar/0/deeplink/compose?subject=${encTitle}&body=${details}`;
    }
  </script>
</body>
</html>
